name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# This suite was not split before. The whole sharded-test vertical is QAtlasHub/TestShards.jl:
# nothing is planned up front — each shard decides what it owns from the same timing history —
# and the reusable merges the shards' coverage into one Codecov upload, merges their records into
# one ordered document, checks that every unit ran exactly once, and refreshes `ci-timings` on
# pushes to main.
#
# The split is not the only thing gained. The exactly-once check and the merged record hold for a
# small suite too, and with no history the first run is round-robin and balances itself from the
# second push onward.
jobs:
  test:
    permissions:
      contents: write   # the timing history is pushed to the `ci-timings` orphan branch
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      # A starting point. The diagnosis printed on every run names the knee for THIS suite —
      # read it and set what it says rather than keeping this number out of inertia.
      shards: 8
      # Also refreshes: a registry present but stale resolves fine while failing to see anything
      # published since it was last pulled.
      registries: |
        General
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The OTHER supported Julia, as a job of its own rather than a matrix leg: the required status
  # check is the context `test / All shards passed`, and a matrix renames it to `test (1) / …`,
  # which would leave every PR waiting on a context that no longer exists.
  #
  # It exists because one version is not enough to know. Julia 1.13 removed `Test.push_testset`,
  # `julia-version: 1` started resolving to it the day it shipped, and the suite went red on a
  # release rather than on a commit. It also makes the version branch in `PinaxTestExt`
  # measurable: only the run on the older Julia executes its fallback, so Codecov sees both sides
  # merged into one report.
  compat:
    permissions:
      contents: write     # the reusable declares it for the timing job; a caller granting less
                          # fails the RUN at startup, even though `record-timings: false` skips it
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      julia-version: '1.12'
      shards: 4
      artifact-prefix: julia112     # artifact names are unique per run, and both legs upload
      record-timings: false         # two legs pushing `ci-timings` would race
      registries: |
        General
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
