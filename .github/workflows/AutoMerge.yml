name: AutoMerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.type == 'Bot' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - name: Enable auto-merge (squash, delete branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # `--merge`, not `--squash`: squash is disabled on this repository, so `--squash` fails
        # with `GraphQL: Squash merges are not allowed on this repository` on every bot pull
        # request. Measured 2026-09-04 — it had never worked, and was one of the two reasons six
        # dependency updates sat unmerged since July.
        run: gh pr merge --auto --merge --delete-branch "$PR_URL"
